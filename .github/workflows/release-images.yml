name: Release images

# A vX.Y.Z tag publishes ghcr.io/beastyrabbit/paperless-llm/{backend,frontend}:X.Y.Z. The homelab
# (beastyrabbit/kub-homelab) follows the newest X.Y.Z through Flux image automation.
# Replaces the Forgejo-only publishing in .forgejo/workflows/docker-publish.yml for GitHub releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Require exact-commit main checks
    runs-on: arc-paperless-llm
    timeout-minutes: 12
    outputs:
      version: ${{ steps.quality.outputs.version }}
      revision: ${{ steps.quality.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
        id: checkout
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for newest successful main push check
        id: quality
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_REVISION: ${{ steps.checkout.outputs.commit }}
        run: node --experimental-strip-types scripts/release/gate.mts

  images:
    needs: gate
    runs-on: arc-paperless-llm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: apps/backend/Dockerfile
          - image: frontend
            dockerfile: Dockerfile.frontend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.revision }}

      - uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://buildkitd.arc-runners.svc.cluster.local:1234

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_TELEMETRY_DISABLED=1
            APP_VERSION=${{ needs.gate.outputs.version }}
            APP_REVISION=${{ needs.gate.outputs.revision }}

  smoke:
    name: Verify Flux deployment
    needs: [gate, images]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: arc-paperless-llm
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Poll deployed versions and check a page
        env:
          APP_VERSION: ${{ needs.gate.outputs.version }}
          APP_REVISION: ${{ needs.gate.outputs.revision }}
          SERVICE_URL: http://paperless-local-llm.documents.svc.cluster.local:3765
        run: node --experimental-strip-types scripts/release/smoke.mts
