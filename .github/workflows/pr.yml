name: Pull Request Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  quality:
    name: Typecheck, lint, test, build
    runs-on: arc-paperless-llm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: node --experimental-strip-types --test scripts/release/*.test.mts
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:artifact
      - run: pnpm check:ref-artifacts
