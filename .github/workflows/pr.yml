name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - document-agent-overhaul

jobs:
  quality:
    name: Typecheck, Lint, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build artifacts for reference guard
        run: pnpm build

      - name: Check reference artifacts
        run: pnpm run check:ref-artifacts

      - name: Install Playwright browsers
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test:e2e
