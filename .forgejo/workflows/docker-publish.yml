name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

enable-openid-connect: true

env:
  REGISTRY: git.heerlab.com
  IMAGE_NAME_BACKEND: beasty/paperless-llm/backend
  IMAGE_NAME_FRONTEND: beasty/paperless-llm/frontend
  INFISICAL_API_URL: ${{ vars.INFISICAL_API_URL }}
  INFISICAL_ENV: ${{ vars.INFISICAL_ENV }}
  INFISICAL_MACHINE_IDENTITY_ID: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID }}
  FJ_CI_INFISICAL_PROJECT_ID: ${{ vars.FJ_CI_INFISICAL_PROJECT_ID }}
  FJ_REGISTRY_SECRET_PATH: ${{ vars.FJ_REGISTRY_SECRET_PATH }}

jobs:
  build-backend:
    runs-on: personal
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Docker CLI
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl docker.io
          docker --version

      - name: Install Infisical CLI
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          npm install --global @infisical/cli@0.43.91
          infisical --version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://buildkitd.forgejo-runners.svc.cluster.local:1234

      - name: Log in to Forgejo Container Registry
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          : "${INFISICAL_API_URL:?Missing INFISICAL_API_URL Forgejo variable}"
          : "${INFISICAL_ENV:?Missing INFISICAL_ENV Forgejo variable}"
          : "${INFISICAL_MACHINE_IDENTITY_ID:?Missing INFISICAL_MACHINE_IDENTITY_ID Forgejo variable}"
          : "${FJ_CI_INFISICAL_PROJECT_ID:?Missing FJ_CI_INFISICAL_PROJECT_ID Forgejo variable}"
          : "${FJ_REGISTRY_SECRET_PATH:?Missing FJ_REGISTRY_SECRET_PATH Forgejo variable}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?Missing Forgejo OIDC request token}"
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?Missing Forgejo OIDC request URL}"

          oidc_response="$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://git.heerlab.com/beasty")"
          forgejo_jwt="$(node -e 'const fs = require("fs"); const body = JSON.parse(fs.readFileSync(0, "utf8")); process.stdout.write(body.value || "");' <<< "$oidc_response")"
          : "${forgejo_jwt:?Forgejo OIDC response did not include a token}"

          infisical_token="$(infisical login \
            --method oidc-auth \
            --machine-identity-id "$INFISICAL_MACHINE_IDENTITY_ID" \
            --jwt "$forgejo_jwt" \
            --domain "$INFISICAL_API_URL" \
            --plain \
            --silent)"
          : "${infisical_token:?Infisical OIDC login returned an empty token}"
          echo "::add-mask::$infisical_token"

          package_token="$(infisical secrets get FORGEJO_PACKAGE_TOKEN \
            --domain "$INFISICAL_API_URL" \
            --token "$infisical_token" \
            --projectId "$FJ_CI_INFISICAL_PROJECT_ID" \
            --env "$INFISICAL_ENV" \
            --path "$FJ_REGISTRY_SECRET_PATH" \
            --plain \
            --silent)"
          : "${package_token:?Missing FORGEJO_PACKAGE_TOKEN in Forgejo CI Infisical project}"
          echo "::add-mask::$package_token"
          printf '%s' "$package_token" | docker login "$REGISTRY" --username beasty --password-stdin

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push Backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/backend/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-frontend:
    runs-on: personal
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Docker CLI
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl docker.io
          docker --version

      - name: Install Infisical CLI
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          npm install --global @infisical/cli@0.43.91
          infisical --version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://buildkitd.forgejo-runners.svc.cluster.local:1234

      - name: Log in to Forgejo Container Registry
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          : "${INFISICAL_API_URL:?Missing INFISICAL_API_URL Forgejo variable}"
          : "${INFISICAL_ENV:?Missing INFISICAL_ENV Forgejo variable}"
          : "${INFISICAL_MACHINE_IDENTITY_ID:?Missing INFISICAL_MACHINE_IDENTITY_ID Forgejo variable}"
          : "${FJ_CI_INFISICAL_PROJECT_ID:?Missing FJ_CI_INFISICAL_PROJECT_ID Forgejo variable}"
          : "${FJ_REGISTRY_SECRET_PATH:?Missing FJ_REGISTRY_SECRET_PATH Forgejo variable}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?Missing Forgejo OIDC request token}"
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?Missing Forgejo OIDC request URL}"

          oidc_response="$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://git.heerlab.com/beasty")"
          forgejo_jwt="$(node -e 'const fs = require("fs"); const body = JSON.parse(fs.readFileSync(0, "utf8")); process.stdout.write(body.value || "");' <<< "$oidc_response")"
          : "${forgejo_jwt:?Forgejo OIDC response did not include a token}"

          infisical_token="$(infisical login \
            --method oidc-auth \
            --machine-identity-id "$INFISICAL_MACHINE_IDENTITY_ID" \
            --jwt "$forgejo_jwt" \
            --domain "$INFISICAL_API_URL" \
            --plain \
            --silent)"
          : "${infisical_token:?Infisical OIDC login returned an empty token}"
          echo "::add-mask::$infisical_token"

          package_token="$(infisical secrets get FORGEJO_PACKAGE_TOKEN \
            --domain "$INFISICAL_API_URL" \
            --token "$infisical_token" \
            --projectId "$FJ_CI_INFISICAL_PROJECT_ID" \
            --env "$INFISICAL_ENV" \
            --path "$FJ_REGISTRY_SECRET_PATH" \
            --plain \
            --silent)"
          : "${package_token:?Missing FORGEJO_PACKAGE_TOKEN in Forgejo CI Infisical project}"
          echo "::add-mask::$package_token"
          printf '%s' "$package_token" | docker login "$REGISTRY" --username beasty --password-stdin

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push Frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.frontend
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_TELEMETRY_DISABLED=1
            APP_VERSION=${{ steps.meta.outputs.version }}
