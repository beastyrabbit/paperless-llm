services:
  # TypeScript Backend
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "8765:8765"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-data:/app/data
    networks:
      - paperless-llm
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8765/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "3765:3765"
    environment:
      - BACKEND_URL=http://backend:8765
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - paperless-llm
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3765/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

volumes:
  backend-data:

networks:
  paperless-llm:
    driver: bridge
