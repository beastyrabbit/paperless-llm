services:
  # TypeScript Backend
  backend:
    container_name: paperless-local-llm-backend
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:-0.145.0}
    ports:
      - "8765:8765"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8765
      PAPERLESS_URL: ${PAPERLESS_URL:?Inject PAPERLESS_URL with Infisical}
      PAPERLESS_TOKEN: ${PAPERLESS_TOKEN:?Inject PAPERLESS_TOKEN with Infisical}
      PAPERLESS_ALLOWED_HOSTS: ${PAPERLESS_ALLOWED_HOSTS:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:?Inject MISTRAL_API_KEY with Infisical}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-ocr-latest}
      MISTRAL_API_BASE_URL: ${MISTRAL_API_BASE_URL:-https://api.mistral.ai}
      OLLAMA_URL: ${OLLAMA_URL:?Inject OLLAMA_URL with Infisical}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:120b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:8b}
      QDRANT_URL: ${QDRANT_URL:?Inject QDRANT_URL with Infisical}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-paperless-documents}
      QDRANT_EMBEDDING_DIMENSION: ${QDRANT_EMBEDDING_DIMENSION:-4096}
      PAPERLESS_LLM_API_TOKEN: ${PAPERLESS_LLM_API_TOKEN:?Inject PAPERLESS_LLM_API_TOKEN with Infisical}
      PAPERLESS_LLM_REQUIRE_SECRETS: ${PAPERLESS_LLM_REQUIRE_SECRETS:-true}
      PAPERLESS_LLM_PROD_READ_ONLY: ${PAPERLESS_LLM_PROD_READ_ONLY:-false}
      PAPERLESS_LLM_MUTATION_MODE: ${PAPERLESS_LLM_MUTATION_MODE:-disabled}
      PAPERLESS_LLM_AI_ANALYSE_SCANNER_SCOPE: ${PAPERLESS_LLM_AI_ANALYSE_SCANNER_SCOPE:-disabled}
      PAPERLESS_LLM_AI_ANALYSE_CANARY_DOCUMENT_IDS: ${PAPERLESS_LLM_AI_ANALYSE_CANARY_DOCUMENT_IDS:-}
      PAPERLESS_LLM_AI_ANALYSE_TAG_ID: ${PAPERLESS_LLM_AI_ANALYSE_TAG_ID:-}
      PAPERLESS_LLM_TRUSTED_UI_ORIGINS: ${PAPERLESS_LLM_TRUSTED_UI_ORIGINS:-http://localhost:3765,http://127.0.0.1:3765}
      PAPERLESS_LLM_CONTAINER_CHECKS_ENABLED: ${PAPERLESS_LLM_CONTAINER_CHECKS_ENABLED:-true}
      PAPERLESS_LLM_BACKEND_WRITER_LOCK_ENABLED: ${PAPERLESS_LLM_BACKEND_WRITER_LOCK_ENABLED:-true}
      PAPERLESS_LLM_BACKEND_WRITER_LOCK_DIR: /app/data/backend-writer.lock
      CODEX_HOME: /app/codex-home
      PAPERLESS_LLM_CODEX_ENABLED: ${PAPERLESS_LLM_CODEX_ENABLED:-false}
      PAPERLESS_LLM_CODEX_AUTH_REQUIRED: ${PAPERLESS_LLM_CODEX_AUTH_REQUIRED:-false}
      PAPERLESS_LLM_MISTRAL_ENABLED: ${PAPERLESS_LLM_MISTRAL_ENABLED:-false}
      PAPERLESS_LLM_MISTRAL_AUTH_REQUIRED: ${PAPERLESS_LLM_MISTRAL_AUTH_REQUIRED:-false}
      PAPERLESS_LLM_AGENT_PROMPT_TIMEOUT_MS: ${PAPERLESS_LLM_AGENT_PROMPT_TIMEOUT_MS:-120000}
      PAPERLESS_LLM_HTTP_TIMEOUT_MS: ${PAPERLESS_LLM_HTTP_TIMEOUT_MS:-120000}
      PAPERLESS_LLM_MISTRAL_RETRY_ATTEMPTS: ${PAPERLESS_LLM_MISTRAL_RETRY_ATTEMPTS:-3}
      PAPERLESS_LLM_MISTRAL_RETRY_BASE_DELAY_MS: ${PAPERLESS_LLM_MISTRAL_RETRY_BASE_DELAY_MS:-5000}
      PAPERLESS_LLM_OLLAMA_MAX_CONCURRENT: ${PAPERLESS_LLM_OLLAMA_MAX_CONCURRENT:-1}
      PAPERLESS_LLM_MISTRAL_MAX_CONCURRENT: ${PAPERLESS_LLM_MISTRAL_MAX_CONCURRENT:-1}
      PAPERLESS_LLM_OCR_MAX_CONCURRENT: ${PAPERLESS_LLM_OCR_MAX_CONCURRENT:-1}
      PAPERLESS_LLM_OCR_DAILY_PAGE_LIMIT: ${PAPERLESS_LLM_OCR_DAILY_PAGE_LIMIT:-unlimited}
      PAPERLESS_LLM_OCR_RUN_PAGE_LIMIT: ${PAPERLESS_LLM_OCR_RUN_PAGE_LIMIT:-unlimited}
      PAPERLESS_LLM_OCR_DAILY_TOKEN_LIMIT: ${PAPERLESS_LLM_OCR_DAILY_TOKEN_LIMIT:-unlimited}
      PAPERLESS_LLM_OCR_RUN_TOKEN_LIMIT: ${PAPERLESS_LLM_OCR_RUN_TOKEN_LIMIT:-unlimited}
      PAPERLESS_LLM_RATE_LIMIT_ENABLED: ${PAPERLESS_LLM_RATE_LIMIT_ENABLED:-true}
      PAPERLESS_LLM_RATE_LIMIT_WINDOW_MS: ${PAPERLESS_LLM_RATE_LIMIT_WINDOW_MS:-60000}
      PAPERLESS_LLM_RATE_LIMIT_MAX_REQUESTS: ${PAPERLESS_LLM_RATE_LIMIT_MAX_REQUESTS:-300}
      PAPERLESS_LLM_RATE_LIMIT_TRUST_PROXY: ${PAPERLESS_LLM_RATE_LIMIT_TRUST_PROXY:-false}
      PAPERLESS_LLM_TINYBASE_DATA_DIR: /app/data/tinybase
      PAPERLESS_LLM_OPERATIONAL_LEDGER_DATA_DIR: /app/data/operational-ledger
      TMPDIR: /app/data/tmp
    volumes:
      - backend-data:/app/data
      - backend-codex-home:/app/codex-home
    networks:
      - paperless-llm
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8765/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    container_name: paperless-local-llm-frontend
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        APP_VERSION: ${APP_VERSION:?Inject APP_VERSION with Infisical}
    ports:
      - "3765:3765"
    environment:
      BACKEND_URL: http://backend:8765
      PAPERLESS_LLM_API_TOKEN: ${PAPERLESS_LLM_API_TOKEN:?Inject PAPERLESS_LLM_API_TOKEN with Infisical}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - paperless-llm
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3765/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

volumes:
  backend-data:
  backend-codex-home:

networks:
  paperless-llm:
    driver: bridge
