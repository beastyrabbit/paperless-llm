# Copy to config.yaml and review the cutoff before enabling OCR.
# Credentials belong in the environment.
paperless:
  url: http://paperless:8000
  externalUrl: https://paperless.example.org
  requestTimeoutMs: 30000
ocr:
  enabled: false
  notBefore: "2099-01-01"
  maxPagesPerDay: 100
  mistralApiBaseUrl: https://api.mistral.ai
  mistralModel: mistral-ocr-latest
  versionMode: in_place
  allowAutoRetryUncertain: false
jev:
  apiBaseUrl: https://api.typesafe.ai/v1/systemone
  model: jev-latest
  shortlistLimit: 50
  thresholds:
    documentType: 0.9
    correspondent: 0.9
    tag: 0.9
    customField: 0.9
    semanticCheck: 0.9
    consolidation: 0.98
llm:
  defaultProvider: cloud
  cloud:
    baseUrl: https://api.openai.com/v1
    model: gpt-4.1
  local:
    baseUrl: http://aibox:8080/v1
    model: local-model
  maxJsonRepairRetries: 1
tags:
  requested: ai:requested
  review: ai:review
  failed: ai:failed
  curated:
    finance: Financial and banking documents
stagingMode: dependency_aware
documentTypes:
  Invoice:
    titleTemplate: "{correspondent} - {invoice_number}"
    llmRouting: cloud
    openFields:
      - name: invoice_number
        kind: string
        required: true
        maxLength: 128
      - name: invoice_date
        kind: date
        required: true
      - name: total
        kind: monetary
        required: true
        semanticCheck: true
    selectFields: []
polling:
  enabled: false
  intervalMs: 30000
  leaseDurationMs: 300000
  maxAttempts: 5
  batchSize: 20
server:
  port: 3765
  host: 0.0.0.0
  # Empty allows loopback Host headers only (DNS-rebinding protection). Add your proxy/Service hostnames in production:
  allowedHosts: []
